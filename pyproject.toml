[project]
name = "hesab"
version = "0.1.0"
description = "Convert scanned monthly attendance forms (PDF) into an Excel workbook using Gemini"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0",
    "pymupdf>=1.24",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "streamlit>=1.30",
]

[project.scripts]
hesab = "hesab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
